name: Lint Commit Messages
on: [push]
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: ./commitlint.config.cjs
        env:
          INPUT_CONFIGFILE: ./commitlint.config.cjs
