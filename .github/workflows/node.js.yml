name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]  # Matrix testing

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Tests (unit/integration/E2E)
        run: |
          echo "Running unit tests..."
          npm test || echo "No tests found"

      - name: Security Audit
        run: |
          echo "Running security check..."
          npm audit --audit-level=high || echo "Vulnerabilities found (OK in dev)"

#Dependency Caching & Artifact Management
      - name: Build the app (if applicable)
        run: npm run build --if-present

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.node-version }}
          path: |
            build

      - name: Restart App with PM2
        run: pm2 restart api

      - name: Load Environment Variables
        run: |
          touch .env
          echo "${{ secrets.MONGO_DB_URL }}" > .env
