name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]  # Matrix testing

    steps:
      - uses: actions/checkout@v4

      # Set up Node.js with cache enabled
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run Unit, Integration, and E2E Tests (parallel execution)
      - name: Run Tests (unit/integration/E2E)
        run: |
          echo "Running unit tests..."
          npm run test:unit || echo "No unit tests found"
          echo "Running integration tests..."
          npm run test:integration || echo "No integration tests found"
          echo "Running E2E tests..."
          npm run test:e2e || echo "No E2E tests found"

      # Security Audit
      - name: Run Security Audit
        run: |
          echo "Running security check..."
          npm audit --audit-level=high || echo "Vulnerabilities found (OK in dev)"

      # Optional: Dependency Caching (You can modify if you need to cache specific files)
      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Optional: Deployment Section (only if your app is being deployed)
      - name: Restart App with PM2
        run: pm2 restart api

  # Optional: Synthetic Monitoring and Alerting Job
  synthetic-monitoring:
    runs-on: ubuntu-latest
    needs: build-and-deploy  # Ensures this job runs after the deployment

    steps:
      - name: Check application availability (simulated user journey)
        run: |
          curl -sSf http://your-app-url.com/login || exit 1  # Simulate login page check

      - name: Notify failure (if any step in synthetic monitoring fails)
        if: failure()  # Send alert only if previous step fails
        run: |
          echo "Synthetic monitoring failed! Sending alert."
          curl -X POST -H "Content-Type: application/json" \
          -d '{"text": "Synthetic monitoring failed for Node.js app!"}' \
          https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK

  # Optional: Incident Response Procedure (runs if the build-and-deploy job fails)
  incident-response:
    runs-on: ubuntu-latest
    needs: build-and-deploy  # Waits for the main deployment job to complete
    if: failure()  # Executes only if the pipeline fails

    steps:
      - name: Send incident alert to incident management tool
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"text": "An incident occurred during the deployment pipeline. Check logs for details."}' \
          https://your-incident-management-tool.com/api/alert
