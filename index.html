<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
</head>
<body>
  <h1>Products</h1>
  <h2>Create Product</h2>
  <form id="create-product-form">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name"><br>
    <label for="description">Description:</label><br>
    <input type="text" id="description" name="description"><br>
    <label for="price">Price:</label><br>
    <input type="number" id="price" name="price"><br>
    <label for="image">Image URL:</label><br>
    <input type="text" id="image" name="image"><br><br>
    <button type="submit">Create</button>
  </form>

  <div id="products"></div>
  <script>
    const productsDiv = document.getElementById('products');

    function fetchProducts() {
      fetch('http://localhost:5000/api/product')
        .then(response => response.json())
        .then(data => {
          productsDiv.innerHTML = '';
          data.forEach(product => {
            const productDiv = document.createElement('div');
            const h2 = document.createElement('h2');
            h2.textContent = product.name;

            const description = document.createElement('p');
            description.textContent = product.description;

            const price = document.createElement('p');
            price.textContent = product.price;

            const img = document.createElement('img');
            img.src = product.image;
            img.alt = product.name;

            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.onclick = function() {
              deleteProduct(product._id);
            };

            const updateForm = document.createElement('form');
            updateForm.id = `update-product-form-${product._id}`;

            const nameLabel = document.createElement('label');
            nameLabel.textContent = 'Name:';
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.id = `name-${product._id}`;
            nameInput.name = 'name';
            nameInput.value = product.name;

            const descriptionLabel = document.createElement('label');
            descriptionLabel.textContent = 'Description:';
            const descriptionInput = document.createElement('input');
            descriptionInput.type = 'text';
            descriptionInput.id = `description-${product._id}`;
            descriptionInput.name = 'description';
            descriptionInput.value = product.description;

            const priceLabel = document.createElement('label');
            priceLabel.textContent = 'Price:';
            const priceInput = document.createElement('input');
            priceInput.type = 'number';
            priceInput.id = `price-${product._id}`;
            priceInput.name = 'price';
            priceInput.value = product.price;

            const imageLabel = document.createElement('label');
            imageLabel.textContent = 'Image URL:';
            const imageInput = document.createElement('input');
            imageInput.type = 'text';
            imageInput.id = `image-${product._id}`;
            imageInput.name = 'image';
            imageInput.value = product.image;

            const updateButton = document.createElement('button');
            updateButton.textContent = 'Update';
            updateButton.onclick = function() {
              updateProduct(product._id);
            };

            updateForm.appendChild(nameLabel);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(nameInput);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(descriptionLabel);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(descriptionInput);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(priceLabel);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(priceInput);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(imageLabel);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(imageInput);
            updateForm.appendChild(document.createElement('br'));
            updateForm.appendChild(updateButton);

            productDiv.appendChild(h2);
            productDiv.appendChild(description);
            productDiv.appendChild(price);
            productDiv.appendChild(img);
            productDiv.appendChild(deleteButton);
            productDiv.appendChild(updateForm);

            productsDiv.appendChild(productDiv);
          });
        });
    }

    function deleteProduct(productId) {
      fetch(`http://localhost:5000/api/product/${productId}`, {
        method: 'DELETE'
      })
      .then(response => response.json())
      .then(data => {
        console.log('Product deleted:', data);
        fetchProducts();
      });
    }

    function updateProduct(productId) {
      event.preventDefault();

      const name = document.getElementById(`name-${productId}`).value;
      const description = document.getElementById(`description-${productId}`).value;
      const price = document.getElementById(`price-${productId}`).value;
      const image = document.getElementById(`image-${productId}`).value;

      fetch(`http://localhost:5000/api/product/${productId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, description, price, image })
      })
      .then(response => response.json())
      .then(data => {
        console.log('Product updated:', data);
        fetchProducts();
      });
    }

    fetchProducts();

    const createProductForm = document.getElementById('create-product-form');
    createProductForm.addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const price = document.getElementById('price').value;
      const image = document.getElementById('image').value;

      fetch('http://localhost:5000/api/product', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, description, price, image })
      })
      .then(response => response.json())
      .then(data => {
        console.log('Product created:', data);
        fetchProducts();
        alert('Product saved successfully!');
        document.getElementById('name').value = '';
        document.getElementById('description').value = '';
        document.getElementById('price').value = '';
        document.getElementById('image').value = '';
      });
    });
  </script>
</body>
</html>
